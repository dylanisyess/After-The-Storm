# Look and feel for app.py (Streamlit reads this file automatically).
[theme]
base = "light"
primaryColor = "#0e6ba8"              # ocean blue: buttons, toggles, links
backgroundColor = "#f7f9fb"           # off-white page
secondaryBackgroundColor = "#e9f1f7"  # pale blue for inputs and sidebars
textColor = "#0b2545"                 # deep navy text
borderColor = "#d6e2ec"               # soft card borders
baseRadius = "0.75rem"                # rounded corners
font = "sans-serif"

[client]
toolbarMode = "minimal"               # hide the developer menu from visitors
